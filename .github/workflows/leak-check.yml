# Blocks secrets: gitleaks over every commit. The personal-data half of the leak check (the private
# blocklist of names, emails and machine names) runs only in the local git hooks, because the
# blocklist is personal data itself and never leaves the owner's machine. No repository secrets.
name: Leak check

on: [push, pull_request]

permissions:
  contents: read

jobs:
  leak-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$tarball"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          mkdir -p bin
          tar -xzf "$tarball" -C bin gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Check every commit for secrets
        run: gitleaks git --redact --no-banner
